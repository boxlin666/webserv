# Workflow name: displayed in the GitHub Actions tab
name: Webserver CI Check

# Define the events that trigger this workflow
on:
  # Trigger automatically when a push is created for the main branch
  push:
    branches: ["main"]
  # Trigger automatically when a pull request is created for the main branch
  pull_request:
    branches: ["main"]
  # Allow manual execution form the GitHub UI for testing/debugging
  workflow_dispatch: {}

jobs:
# Job ID: defines a group of steps
  test:
  # Use the latest Ubuntu virtual machine provided by Github
    runs-on: ubuntu-latest
    steps:
    # Step 1: Download the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

    # 2. 安装并设置你指定版本的 Python 环境（推荐的做法）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 这里可以换成你需要测试的任意 Python 版本

      # 3. 核心：打印 Python 解释器的路径
      - name: Print Python Interpreter Path
        run: |
          echo "=== 方法 1：使用系统 which 命令 ==="
          which python
          which python3
          
          echo "=== 方法 2：让 Python 打印自身绝对路径（最精准） ==="
          python -c "import sys; print(sys.executable)"
          
          echo "=== 方法 3：查看当前的 Python 版本 ==="
          python --version

      - name: Install Build Essentials
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Check Environment Versions
        run: |
          echo "--- GCC Version---"
          g++ --version
          echo "--- Clang Version ---"
          clang++ --version
          echo "--- Make Version --"
          make --version
          echo "--- OS Version ---"
          lsb_release -a

      - name: Compile Webserver
        run: make
      
      - name: Verify Executable
        run: ls -l webserv

    # Step 2: Install the specific Python version 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

    # Step 3: Install project dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

    # Step 4: Execute Pytest
    # If any test fails, ths step returns a non-zero exit code
    # and the workflow will stop immediately (makred as Failed/KO)
      - name: Run tests
        run: pytest
