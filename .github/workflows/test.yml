# Workflow name: displayed in the GitHub Actions tab
name: Webserver CI Check

# Define the events that trigger this workflow
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print Python Interpreter Path
        run: |
          echo "=== 方法 1：使用系统 which 命令 ==="
          which python
          which python3
          
          echo "=== 方法 2：让 Python 打印自身绝对路径（最精准） ==="
          python -c "import sys; print(sys.executable)"
          
          echo "=== 方法 3：查看当前的 Python 版本 ==="
          python --version

      - name: Install Build Essentials
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Check Environment Versions
        run: |
          echo "--- GCC Version---"
          g++ --version
          echo "--- Clang Version ---"
          clang++ --version
          echo "--- Make Version --"
          make --version
          echo "--- OS Version ---"
          lsb_release -a

      - name: Compile Webserver
        run: make
      
      - name: Verify Executable
        run: ls -l webserv

      - name: Create 42 Test Directory Environment
        run: |
          echo "=== 正在为 42.conf 伪造磁盘 root 目录环境 ==="
          mkdir -p ./YoupiBanane/post_body
          echo "目录创建成功，当前虚拟磁盘状态："
          ls -R ./YoupiBanane

      - name: Configure CGI Tester Permissions
        run: |
          echo "=== 正在为 cgi_tester 赋予 755 权限 ==="
          if [ -f "cgi_tester" ]; then
            chmod 755 cgi_tester
            ls -l cgi_tester
          elif [ -f "www/cgi-bin/cgi_tester" ]; then
            chmod 755 www/cgi-bin/cgi_tester
            ls -l www/cgi-bin/cgi_tester
          else
            echo "⚠️ 警告: 未在根目录或 www/cgi-bin/ 找到 cgi_tester，尝试对所有 .py 脚本赋权"
            find . -name "*.py" -exec chmod 755 {} +
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # ─── 新增：Vitest 前端测试 ──────────────────────────────────────────
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 编译 webserv（Vitest 测试需要真实服务器进程）
      - name: Install Build Essentials
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Compile Webserver
        run: make

      - name: Verify Executable
        run: ls -l webserv

      # 2. 伪造测试所需目录（和 pytest job 保持一致）
      - name: Create Test Directory Environment
        run: |
          mkdir -p ./YoupiBanane/post_body

      - name: Configure CGI Tester Permissions
        run: |
          if [ -f "cgi_tester" ]; then
            chmod 755 cgi_tester
          elif [ -f "www/cgi-bin/cgi_tester" ]; then
            chmod 755 www/cgi-bin/cgi_tester
          else
            find . -name "*.py" -exec chmod 755 {} +
          fi

      # 3. 启动 webserv 后台进程
      - name: Start Webserver
        run: |
          ./webserv conf/default.conf &        # ← 把 your_config.conf 换成你实际的配置文件名
          echo "WEBSERV_PID=$!" >> $GITHUB_ENV
          echo "等待服务器启动..."
          sleep 2
          echo "=== 确认服务器进程存活 ==="
          ps aux | grep webserv | grep -v grep

      # 4. 安装 Node 并运行 Vitest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      # 5. 无论测试成功与否，都清理掉后台的 webserv 进程
      - name: Stop Webserver
        if: always()
        run: |
          if [ -n "$WEBSERV_PID" ]; then
            kill $WEBSERV_PID || true
          fi