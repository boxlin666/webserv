server {
    listen 8000;
    server_name example.com www.example.com;
    root ./www/example;
}

server {
    listen 8000;
    server_name blog.example.com;
    root ./www/blog;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root ./www/dev;
}

server {
    listen 0.0.0.0:8080;
    server_name public.com;
    root ./www/public;
}

server {
    listen 9090;
    server_name test.io;
    root ./www/test;
}

server {
    listen 8888;
    listen 8889;
    server_name multi-port.com;
    root ./www/multi;
}