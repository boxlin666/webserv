server {
    listen 8080;
    listen 8081;
    server_name localhost;
    root ./www;
    index index.html;
    error_page 404 /custom_404.html;

    client_max_body_size       10m;
    methods GET;
    autoindex on;

    location / {
        root ./www;
        index index.html;
    }

    location /index.html {
        methods GET;
    }
}

server {
    listen 8080;
    listen 8082;
    server_name cat.com;
    root ./www/cat;
    error_page 404 /custom_404.html;

    client_max_body_size       10m;
    methods GET POST;

}
