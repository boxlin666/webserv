# ---------------------------------------------------------
# 场景 1: 标准 HTTP 端口 (80)，包含多个虚拟主机
# ---------------------------------------------------------
server {
    listen 8000;
    server_name example.com www.example.com;
    # 这是 80 端口的第一个 server，它将是该端口的 Default Server
    root ./www/example;
}

server {
    listen 8000;
    server_name blog.example.com;
    root ./www/blog;
}

# ---------------------------------------------------------
# 场景 2: 高端口 (8080)，混合 IP 绑定
# ---------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    # 仅允许本地访问的开发环境
    root ./www/dev;
}

server {
    listen 0.0.0.0:8080;
    server_name public.com;
    # 监听所有网卡的 8080 端口
    root ./www/public;
}

# ---------------------------------------------------------
# 场景 3: 另一个完全独立的端口 (9090)
# ---------------------------------------------------------
server {
    listen 9090;
    server_name test.io;
    root ./www/test;
}

# ---------------------------------------------------------
# 场景 4: 极端情况 - 一个 Server 块监听多个端口
# ---------------------------------------------------------
server {
    listen 8888;
    listen 8889;
    server_name multi-port.com;
    root ./www/multi;
}