server {
    listen 8080;
    server_name test.com;
    root ./docs/default;

    # 1. 根目录匹配（优先级最低）
    location / {
        root ./docs/root_path;
        index index.html;
    }

    # 2. 中等长度匹配
    location /images {
        root ./docs/media;
        index media.html;
    }

    # 3. 最长前缀匹配测试点
    # 如果请求 /images/icons/logo.png，应该匹配这里，而不是上面的 /images
    location /images/icons {
        root ./docs/icons_collection;
        index icons.html;
    }

    # 4. 另一个维度的最长匹配
    location /api/v1 {
        root ./docs/api_old;
    }

    location /api/v1/users {
        root ./docs/api_new;
    }
}