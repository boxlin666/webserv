server {
    listen 0.0.0.0:8080;
    listen 127.0.0.3:8081;
    server_name localhost lilou;
    root ./www;
    index index.html;
    error_page 404 /custom_404.html;

    client_max_body_size       1000000000000;
    methods GET POST DELETE;
    autoindex on;

    location / {
        root ./www;
        methods GET POST;
        index index.html;
        client_max_body_size       1000000000000;
    }

    location /uploads {
        root ./www/uploads;
        methods POST;
        client_max_body_size       1000000000000;
    }

    location /test/index.html {
        methods GET;
    }


    location /images {
        root /tmp/imgs;
    }

    location / {
        return 301 http://another-site.com;
    }

    location /request{
        methods GET;
        root ./www/request;
    }

    location /usr{
        methods POST;
        root ./www/user_data;
        upload_path ./www/user_data/uploads;
    }

    location /images {
        root /tmp/imgs/;
    }

    location /private {
        root /www/secret;
        autoindex off;
    }

    location /cgi-bin {
        root ./www/cgi-scripts; 
        methods GET POST;

        # 核心修改：让服务器的 CGI 处理器直接去调用你虚拟环境里的 Python
        # cgi_path    /opt/hostedtoolcache/Python/3.10.20/x64/bin/python;
        #cgi_path  /usr/bin/python3;
        cgi_path ./.venv/bin/python3; 
        cgi_ext .py; 
    }

}

server {
    listen 8080;
    listen 8082;
    server_name cat.com;
    root ./www/cat;
    error_page 404 /custom_404.html;

    client_max_body_size       10m;
    methods GET POST;
}

server {
    listen 8083;
    server_name dog.com;
    root ./www/dog;
    error_page 404 /custom_404.html;
 
    client_max_body_size       10m;
    methods GET POST;

}

