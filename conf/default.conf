server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;
    server_name localhost;
    root ./www/localhost;
    index index.html;
    error_page 404 /custom_404.html;

    client_max_body_size       10m;
    methods GET;
    autoindex on;

    location / { 
    }

    location /images {
        root /tmp/imgs
    }

    location / {
        return 301 http://another-site.com;
    }

    location /request{
        methods GET;
        root ./www/request;
    }

    location /usr{
        methods POST;
        root ./www/user_data;
        upload_path ./www/user_data/uploads;
    }

    location /images {
        root /tmp/imgs/;
    }

    location /private {
        root /www/secret;
        autoindex off;
    }

    location /cgi-bin {
        methods GET POST;
        cgi_pass ./cgi-bin/php-cgi;
    }

}

server {
    listen 0.0.0.0:8080;
    listen 0.0.0.0:8082;
    server_name cat.com;
    root ./www/cat;
    error_page 404 /custom_404.html

    client_max_body_size       10m;
    methods GET POST;

}

server {
    listen 0.0.0.0:8083;
    server_name dog.com;
    root ./www/dog;
    error_page 404 /custom_404.html
 
    client_max_body_size       10m;
    methods GET POST;

}

