server {
    listen              127.0.0.1:8080;
    server_name         local.dev dev.local;
    root                ./YoupiBanane;

    index   youpi.bad_extension
    cgi_path            ./cgi_tester;
    cgi_ext             .bla;

    methods        GET POST DELETE;

    location / {
        methods    GET;
        index            youpi.bad_extension;
    }

    location /put_test {
        methods    PUT;
        upload_path       ./YoupiBanane/upload;
    }

    location /post_body {
        methods    POST;
        client_max_body_size    100;
    }

    location /directory {
        methods    GET POST;
        root             ./YoupiBanane;
        index            youpi.bad_extension;
    }
}
