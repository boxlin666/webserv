<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio-Control Nucleus | Access Granted</title>
    <style>
        /* ================= Default format web page (Green theme)================= */
        body { 
            font-family: monospace; 
            background: #020617; 
            color: #34d399; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            transition: background 0.4s ease; 
        }
        
        .box { 
            background: rgba(0, 0, 0, 0.8); 
            padding: 2rem; 
            border-radius: 8px; 
            border: 2px solid #34d399; 
            text-align: center; 
            width: 320px; 
            transition: all 0.4s ease;
        }
        
        .vault { background: rgba(0, 0, 0, 0.6); padding: 1rem; border-radius: 4px; text-align: left; margin: 1.5rem 0; font-size: 0.9rem; line-height: 1.6; }
        
        /* default color is green */
        h2, p, .vault, .nav-btn { color: #34d399; }

        .nav-btn { 
            display: block; 
            margin-top: 0.75rem; 
            padding: 0.6rem; 
            border: 1px solid #34d399; 
            text-decoration: none; 
            font-weight: bold; 
            cursor: pointer; 
            background: transparent; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        /* ================= Blue theme ================= */
        html[data-theme="cyber-blue"] body { background: #020c1b; }
        html[data-theme="cyber-blue"] .box { border-color: #38bdf8 !important; }
        html[data-theme="cyber-blue"] h2, 
        html[data-theme="cyber-blue"] p, 
        html[data-theme="cyber-blue"] .vault, 
        html[data-theme="cyber-blue"] .nav-btn { 
            color: #38bdf8 !important; 
            border-color: #38bdf8 !important;
        }
        
        /* ================= Purple theme ================= */
        html[data-theme="cyber-purple"] body { background: #090514; }
        html[data-theme="cyber-purple"] .box { border-color: #c084fc !important; }
        html[data-theme="cyber-purple"] h2, 
        html[data-theme="cyber-purple"] p, 
        html[data-theme="cyber-purple"] .vault, 
        html[data-theme="cyber-purple"] .nav-btn { 
            color: #c084fc !important; 
            border-color: #c084fc !important;
        }
    </style>
</head>
<body>

    <div class="box">
        <div style="font-size: 3rem;" id="vault-icon">🐱</div>
        <h2>YES YOU DO HAVE A COOKIE 🍪!</h2>
        <p>[ Welcome back, {{USERNAME}} ]</p>
        
        <div class="vault">
            <b style="color: white; display: block; margin-bottom: 0.5rem;">HERE IS YOUR INFORMATION BELOW:</b>
            • USER : {{USERNAME}}<br>
            • TOKEN: {{PASSWORD}}<br>
            • COLOR: <span id="theme-log-text">{{COLOR}}</span>
        </div>

        <div class="action-group">
            <a href="/index.html" class="nav-btn">🏠 MATRIX INDEX</a>
            
            <form action="/logout/logout.py" method="POST" style="margin: 0;">
                <button type="submit" class="nav-btn" style="color: #ff0055; border-color: #ff0055;">🐾 PURGE SESSION</button>
            </form>
        </div>
    </div>

    <script>
        // Reading the prefered color to render the webpage and add the correspond emoji 
        function getLabCookie(key) {
            if (!document.cookie) return null; 
            // step 1: ex request body input: "id=123; lab_mutation=blue" => ["id=123", "lab_mutation=blue"]
            let cookieArray = document.cookie.split('; ');

            // step 2: iterate to find out the value that matches with the key! 
            for (let i = 0; i < cookieArray.length; i++) { 
                //split the key and value into 2 parts with "="
                let parts = cookieArray[i].split('=');
                let currentKey = parts[0];
                let currentValue = parts[1];

                // find out the value that matches the key, return the value immediately
                if (currentKey === key) { 
                    return currentValue;
            }
        }

        // Nothing has been found out :(
        return null;
    }

        const savedMutation = getLabCookie('lab_mutation') || 'hacker-green';
        document.getElementById('theme-log-text').innerText = savedMutation.toUpperCase();

        if (savedMutation === 'cyber-blue') {
            document.documentElement.setAttribute('data-theme', 'cyber-blue');
            document.getElementById('vault-icon').innerText = '🐳';
        } else if (savedMutation === 'cyber-purple') {
            document.documentElement.setAttribute('data-theme', 'cyber-purple');
            document.getElementById('vault-icon').innerText = '👾';
        }
    </script>
</body>
</html>
