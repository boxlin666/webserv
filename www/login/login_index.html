<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Webserv Login</title>
</head>
<link rel="icon" href="data:,">
<body style="font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#edf2f7; margin:0;">
    <div style="background:white; padding:2.5rem; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.05); width:320px;">
        <h2 style="margin-top:0; color:#2d3748; text-align:center;">Sign In</h2>
        
        <form action="/login/login.py" method="POST" style="display:flex; flex-direction:column; gap:1.2rem;">
            <div>
                <label style="display:block; margin-bottom:0.4rem; color:#4a5568;">Username</label>
                <input type="text" name="username" required style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #cbd5e0; box-sizing:border-box;">
            </div>
            
            <div>
                <label style="display:block; margin-bottom:0.4rem; color:#4a5568;">Password</label>
                <input type="password" name="password" required style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #cbd5e0; box-sizing:border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:0.4rem; color:#4a5568;">Genetic Theme Choice</label>
                <select name="color" style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #cbd5e0; background:white; box-sizing:border-box; cursor:pointer; font-weight: 500; color:#2d3748;">
                    <option value="hacker-green">🐱 Hacker Green (Default)</option>
                    <option value="bio-red" style="color: #ff0055;">🦁 Bio-Control Red</option>
                    <option value="cyber-purple" style="color: #bc00ff;">👾 Cyberpunk Purple</option>
                </select>
            </div>
            
            <button type="submit" style="background:#3182ce; color:white; border:none; padding:0.7rem; border-radius:6px; font-weight:bold; cursor:pointer;">Login</button>
        </form>
    </div>
</body>
</html>
