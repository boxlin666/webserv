<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Webserv Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #edf2f7; margin: 0; }
        .box { background: white; padding: 2rem; border-radius: 12px; width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; text-align: center; color: #2d3748; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        label { display: block; margin-bottom: 0.3rem; color: #4a5568; font-size: 0.9rem; }
        input, select, button { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        button { background: #3182ce; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Sign In</h2>
        <form action="/login/login.py" method="POST">
            <div>
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div>
                <label>Genetic Theme Choice</label>
                <select name="color">
                    <option value="hacker-green">🐱 Hacker Green</option>
                    <option value="cyber-blue" style="color: #00d2ff; font-weight: bold;">🐳 Cyber Space Blue</option>
                    <option value="cyber-purple" style="color: #bc00ff;">👾 Cyber Purple</option>
                </select>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
