<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Server | Ultimate Tri-Genetics Lab</title>
    <link rel="icon" href="data:,">
    <style>
        /* ================= Green theme ================= */
        :root {
            --primary: #00ff66;
            --primary-glow: rgba(0, 255, 102, 0.4);
            --bg-gradient: linear-gradient(135deg, #020617 0%, #052e16 100%);
            --text-main: #34d399;
            --text-sub: #059669;
        }

        /* ================= Blue theme ================= */
        [data-theme="cyber-blue"] {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --bg-gradient: linear-gradient(135deg, #020c1b 0%, #032b45 100%);
            --text-main: #38bdf8;
            --text-sub: #0369a1;
        }

        /* ================= Purple theme ================= */
        [data-theme="cyber-purple"] {
            --primary: #bc00ff;
            --primary-glow: rgba(188, 0, 255, 0.4);
            --bg-gradient: linear-gradient(135deg, #090514 0%, #2e0854 100%);
            --text-main: #c084fc;
            --text-sub: #7e22ce;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg-gradient);
            color: #f8fafc;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .cat-logo {
            font-size: 5.5rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, var(--primary), #ffffff, var(--text-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--primary-glow);
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            background: var(--primary);
            color: #020617;
            box-shadow: 0 0 30px var(--primary);
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <div class="cat-logo" id="cat-core">🧬</div>
        <h1>CAT_SERVER_v1.0</h1>
        <p class="subtitle"></p>

        <a href="/auth/auth_check.py" class="cta-btn">
            DO I HAVE A COOKIE? 🍪
        </a>
    </div>

    <script>
        // Reading the prefered color to render the webpage and add the correspond emoji 
    function getLabCookie(key) {
        if (!document.cookie) return null; 
        // step 1: ex request body input: "id=123; lab_mutation=blue" => ["id=123", "lab_mutation=blue"]
        let cookieArray = document.cookie.split('; ');

        // step 2: iterate to find out the value that matches with the key! 
        for (let i = 0; i < cookieArray.length; i++) {
            
            //split the key and value into 2 parts with "="
            let parts = cookieArray[i].split('=');
            let currentKey = parts[0];
            let currentValue = parts[1];

            // find out the value that matches the key, return the value immediately
            if (currentKey === key) { 
                return currentValue;
            }
        }

        // Nothing has been found out :(
        return null;
    }
 
        const currentSavedMutation = getLabCookie('lab_mutation') || 'hacker-green';

        if (currentSavedMutation === 'cyber-blue') {
            document.documentElement.setAttribute('data-theme', 'cyber-blue');
            document.getElementById('cat-core').innerText = '🐳'; 
        } else if (currentSavedMutation === 'cyber-purple') {
            document.documentElement.setAttribute('data-theme', 'cyber-purple');
            document.getElementById('cat-core').innerText = '👾';
        } else {
            document.getElementById('cat-core').innerText = '🐱';
        }
    </script>
</body>
</html>
